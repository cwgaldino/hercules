<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Band 9 Heart Rate Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e91e63">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #b3b3b3;
        }
        .hr-display {
            font-size: 5rem;
            font-weight: bold;
            color: #e91e63;
            margin: 20px 0;
            transition: transform 0.1s ease;
        }
        .hr-display.pulse {
            transform: scale(1.1);
        }
        .unit {
            font-size: 1.5rem;
            color: #888;
            margin-left: 5px;
        }
        button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #d81b60;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
        .instructions {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: left;
            color: #bbb;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .instructions ol {
            margin: 5px 0 0 20px;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="instructions">
        <strong>Prerequisite:</strong>
        <ol>
            <li>Open Mi Fitness App -> Device -> Health Monitoring -> Heart Rate.</li>
            <li>Turn ON <strong>Heart Rate Broadcast</strong> / Sharing.</li>
        </ol>
    </div>
    
    <h1>Mi Band 9 Heart Rate</h1>
    <div class="hr-display" id="hrValue">--<span class="unit">BPM</span></div>
    <div class="status" id="statusText">Disconnected</div>
    <button id="connectBtn">Connect Band</button>
</div>

<script>
    const MIBAND_SERVICE_UUID = '0000fee0-0000-1000-8000-00805f9b34fb';
    const AUTH_CHARACTERISTIC_UUID = '00000009-0000-1000-8000-00805f9b34fb';
    const HEART_RATE_SERVICE_UUID = '0000180d-0000-1000-8000-00805f9b34fb';
    const HR_MEASUREMENT_UUID = '00002a37-0000-1000-8000-00805f9b34fb';
    const HR_CONTROL_UUID = '00002a39-0000-1000-8000-00805f9b34fb';

    let authCharacteristic, hrControlCharacteristic;
    const statusDiv = document.getElementById('status');
    const hrDisplay = document.getElementById('hrValue');

    function updateStatus(text) {
      statusDiv.innerText = text;
      console.log(text);
    }

    function parseHexKey(hexString) {
      if (hexString.length !== 32) throw new Error("Key must be exactly 32 hex characters.");
      const key = new Uint8Array(16);
      for (let i = 0; i < 16; i++) {
        key[i] = parseInt(hexString.substr(i * 2, 2), 16);
      }
      return key;
    }

    // Hooking the Web Bluetooth request to the button click event
    document.getElementById('connectBtn').addEventListener('click', async () => {
      const userHexKey = document.getElementById('authKeyInput').value.trim();
      
      if (userHexKey.length !== 32) {
        alert("Please enter a valid 32-character hex key.");
        return;
      }

      let secretKeyBytes;
      try {
        secretKeyBytes = parseHexKey(userHexKey);
      } catch (e) {
        alert(e.message);
        return;
      }

      try {
        updateStatus("Requesting Mi Band 9 device...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [MIBAND_SERVICE_UUID] }],
          optionalServices: [HEART_RATE_SERVICE_UUID]
        });

        updateStatus("Connecting to GATT Server...");
        const server = await device.gatt.connect();

        updateStatus("Accessing authentication service...");
        const xiaomiService = await server.getPrimaryService(MIBAND_SERVICE_UUID);
        authCharacteristic = await xiaomiService.getCharacteristic(AUTH_CHARACTERISTIC_UUID);

        updateStatus("Fetching heart rate controllers...");
        const hrService = await server.getPrimaryService(HEART_RATE_SERVICE_UUID);
        hrControlCharacteristic = await hrService.getCharacteristic(HR_CONTROL_UUID);
        const hrMeasurement = await hrService.getCharacteristic(HR_MEASUREMENT_UUID);

        updateStatus("Subscribing to auth notifications...");
        await authCharacteristic.startNotifications();
        authCharacteristic.addEventListener('characteristicvaluechanged', (e) => handleAuthNotification(e, secretKeyBytes, hrMeasurement));

        updateStatus("Sending authorization challenge request...");
        const requestChallengeCmd = new Uint8Array([0x02, 0x00]); 
        await authCharacteristic.writeValue(requestChallengeCmd);

      } catch (error) {
        updateStatus(`BLE Error: ${error.message}`);
      }
    });

    async function handleAuthNotification(event, secretKey, hrMeasurementChar) {
      const value = new Uint8Array(event.target.value.buffer);

      if (value[0] === 0x10 && value[1] === 0x02 && value[2] === 0x01) {
        updateStatus("Challenge received! Solving encryption...");
        
        const challengeBytes = value.slice(3, 19); 
        const cryptoKey = await crypto.subtle.importKey(
          "raw", secretKey, { name: "AES-CBC" }, false, ["encrypt"]
        );
        
        const zeroIv = new Uint8Array(16); 
        const encryptedBuffer = await crypto.subtle.encrypt(
          { name: "AES-CBC", iv: zeroIv }, cryptoKey, challengeBytes
        );
        
        const encryptedSolution = new Uint8Array(encryptedBuffer).slice(0, 16);
        const responseCmd = new Uint8Array(18);
        responseCmd[0] = 0x03;
        responseCmd[1] = 0x00;
        responseCmd.set(encryptedSolution, 2);

        updateStatus("Sending solution back to band...");
        await authCharacteristic.writeValue(responseCmd);
      } 
      
      else if (value[0] === 0x10 && value[1] === 0x03 && value[2] === 0x01) {
        updateStatus("Authenticated! Starting heart rate sensor...");
        
        // Command to wake up continuous tracking
        await hrControlCharacteristic.writeValue(new Uint8Array([0x01, 0x01]));

        updateStatus("Connected & Streaming Data");
        await hrMeasurementChar.startNotifications();
        hrMeasurementChar.addEventListener('characteristicvaluechanged', (e) => {
          const hrValue = new Uint8Array(e.target.value.buffer);
          // Standard GATT layout puts the actual heart rate index in byte position 1
          hrDisplay.innerText = hrValue[1];
        });
      } 
      
      else if (value[2] === 0x04) {
        updateStatus("Authentication rejected! Incorrect Auth Key.");
      }
    }






    const connectBtn = document.getElementById('connectBtn');
    const hrValue = document.getElementById('hrValue');
    const statusText = document.getElementById('statusText');

    let bluetoothDevice = null;

    connectBtn.addEventListener('click', async () => {
        if (!navigator.bluetooth) {
            alert('Web Bluetooth is not supported on this browser or context (requires HTTPS).');
            return;
        }

        try {
            statusText.textContent = "Searching for Mi Band...";
            // Filters by standard Heart Rate service
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }]
            });

            statusText.textContent = "Connecting to device...";
            const server = await bluetoothDevice.gatt.connect();

            statusText.textContent = "Fetching Heart Rate Service...";
            const service = await server.getPrimaryService('heart_rate');

            statusText.textContent = "Fetching Characteristic...";
            const characteristic = await service.getCharacteristic('heart_rate_measurement');

            statusText.textContent = "Subscribing to heart rate updates...";
            await characteristic.startNotifications();

            statusText.textContent = "Connected & Active";
            connectBtn.disabled = true;

            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                const value = event.target.value;
                const flags = value.getUint8(0);
                const rate16Bits = flags & 0x01;
                let heartRate;

                if (rate16Bits) {
                    heartRate = value.getUint16(1, true);
                } else {
                    heartRate = value.getUint8(1);
                }

                hrValue.innerHTML = `${heartRate}<span class="unit">BPM</span>`;
                
                // Visual heartbeat effect
                hrValue.classList.add('pulse');
                setTimeout(() => hrValue.classList.remove('pulse'), 150);
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                statusText.textContent = "Disconnected";
                hrValue.innerHTML = `--<span class="unit">BPM</span>`;
                connectBtn.disabled = false;
            });

        } catch (error) {
            console.error(error);
            statusText.textContent = "Error: " + error.message;
        }
    });

    // Register simple Service Worker for PWA compliance
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.error('Service Worker Registry Failed', err));
    }
</script>
</body>
</html>
