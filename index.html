<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;  /* Use the operating system's native UI font */
            margin: 0;                      /* Remove the browser's default page margin */
            padding: 10px;                  /* Add spacing between the window edge and the content */
            background-color: #0b0f19;    /* Background color */
            color: #ffffff;               /* Text color */
            box-sizing: border-box;         /* Include padding and borders when calculating element sizes */
            display: flex;                  /* Turns the body into a Flexbox container. All direct children become flex items */
            flex-direction: column;         /* Stack flex child elements vertically (dvh = dynamic viewport height) */
            height: 100dvh;                 /* Make the body fill the visible screen height */
            transition: background-color 0.1s ease;  /* Smoothly animate background-color changes */
            overscroll-behavior-y: none;    /* none = Disable pull-to-refresh and other vertical overscroll effects */
            -webkit-overflow-scrolling: touch;  /* Enable smooth momentum scrolling on iOS */
            gap: 10px;  /* gap between top and bottom panel */
        }
        .top {
            display: flex;
            flex: 1;
            flex-direction: row;
            gap: 10px;
        }
        .top-left {
            display: flex;
            flex-direction: column;
            flex-grow: 1;  /* fill remaining width */
            gap: 5px;
            /* margin-bottom: 12px; */
            /* width: 70%; */
        }
        .top-right {
            display: flex;
            flex-direction: column;
            width: 100px;
            gap: 5px;
            flex-shrink: 0;  /* Do not shrink this element below its natural or specified size */
        }
        textarea {
            width: 100%;
            flex: 1;
            min-height: 0; 

            background: #161b26;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            padding: 10px;
            font-size: 16px;
            
            resize: none;
            box-sizing: border-box;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #161b26; 
            border: 1px solid #334155;
            padding: 10px; 
            border-radius: 12px; 
        }
    </style>
    <!-- ----------------------------------------------------------------------
    CUSTOM DROPDOWN
    ----------------------------------------------------------------------- -->
    <style>
        .dropdown1 {
            width: 100%;
            padding: 5px;
            background: #161b26;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
        }
    </style>
    <!-- ----------------------------------------------------------------------
    CUSTOM SWITCHES
    ----------------------------------------------------------------------- -->
    <style>
        /* The switch box row (this will hold multiple switches) */
        .horizontal-switch-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            /* background: #161b26; */
            /* padding: 4px 10px; */
            /* border-radius: 12px; */
            /* border: 1px solid #273142; */
            gap: 8px;

            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* The switch - the box around the slider */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }
        /* Hide default HTML checkbox */
        .switch input {opacity: 0; width: 0; height: 0}
        /* The slider */
        .slider-switch {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2c354a; transition: .2s; border-radius: 18px;
        }
        .slider-switch:before {
            position: absolute; content: "";
            height: 12px; width: 12px; left: 3px; bottom: 3px;
            background-color: white; transition: .2s; border-radius: 50%;
        }
        input:checked + .slider-switch { background-color: #34c759; }
        input:checked + .slider-switch:before { transform: translateX(16px); }
    </style>
    <!-- ----------------------------------------------------------------------
    CUSTOM BUTTONS
    ----------------------------------------------------------------------- -->
    <style>
        /* Global Button Styles */
        button {
            padding: 14px; 
            border: none; 
            border-radius: 12px;
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer;
            color: white; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button:disabled { background-color: #1a202c !important; color: #4a5568 !important; cursor: not-allowed; opacity: 0.6; }

        .button1 { background-color: #2c354a; color: #cbd5e1; }
        .button2 { background-color: #34c759; }
        .button3 { background-color: #ff9500; }

        .horizontal-button-box {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .horizontal-button-box button { 
            flex: 1;  /* expand buttons */
        }

    </style>
</head>
<body>
    <!-- ----------------------------------------------------------------------
    TOP PANEL 
    ----------------------------------------------------------------------- -->
    <div class="top">
        <div class="top-left">

            <div class="horizontal-switch-box">
                <span>Text</span>
                <label class="switch">
                    <input type="checkbox" id="textToggle" checked>
                    <span class="slider-switch"></span>
                </label>

                <span>Scroll</span>
                <label class="switch">
                    <input type="checkbox" id="scrollToggle" checked>
                    <span class="slider-switch"></span>
                </label>
            </div>

            <select id="dropdown" class="dropdown1" tabindex="-1">
                <option value="">Select Workout Session</option>
            </select>
            <textarea id="textbox"></textarea>
        </div>
        <div class="top-right">

            <div class="horizontal-switch-box">
                <span>Buttons</span>
                <label class="switch">
                    <input type="checkbox" id="textToggle" checked>
                    <span class="slider-switch"></span>
                </label>
            </div>

            <button id="button-settings" class="button1">⚙️</button>
            <button id="button-hr"       class="button1">❤️</button>
            <button id="button-timer"    class="button1">⏰</button>

            <textarea id="textbox2"></textarea>
        </div>
    </div>

    <!-- ----------------------------------------------------------------------
    BOTTOM PANEL 
    ----------------------------------------------------------------------- -->
    <div class="bottom">
        <div class="horizontal-button-box">
            <button id="button-preset1" class="button1" onclick="selectPreset(1)">40 s</button>
            <button id="button-preset2" class="button1" onclick="selectPreset(2)">60 s</button>
            <button id="button-preset3" class="button1" onclick="selectPreset(3)">90 s</button>
            <button id="button-preset4" class="button1" onclick="selectPreset(4)">120 s</button>
        </div>
        <button id="button-rest" class="button3">Rest</button>
    </div>

    
    <script>
        // ====================================================================
        // ELEMENTS
        // ====================================================================
        const elements = {
            textbox: document.getElementById('textbox'),
            };

        // ====================================================================
        // STATE
        // ====================================================================
        const defaultState = {
            text: `Use # to name sessions (e.g., # Chest);
            Write your workout routine here...`,
            allowPullToRefresh: true,
            darkMode: false,
            largeKeyboard: true,
            keepScreenAwake: false,
        };

        const currentState = {
            ...defaultState,
            ...JSON.parse(localStorage.getItem('currentState') || '{}')
        };

        function applyState() {
            elements.textbox.value = currentState.text;
        }

        function saveState() {
            localStorage.setItem('currentState', JSON.stringify(currentState));
        }


        // ====================================================================
        // EVENT LISTENERS 
        // ====================================================================

        // Not sure we need this one because we are always saving after each change
        // window.addEventListener('beforeunload', () => {
        //     saveState();
        // });

        // Save state when text changes
        elements.textbox.addEventListener('input', () => {
            currentState.text = elements.textbox.value;
            saveState();
        });

        // ====================================================================
        // INITIALIZATION 
        // ====================================================================
        applyState()

    </script>
</body>
</html>
